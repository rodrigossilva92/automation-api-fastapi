[tool.poetry]
name = "automation-api-fastapi"
version = "0.1.0"
description = "Automation-focused backend API built with FastAPI"
authors = ["Rodrigo Silva <rodrigo.sousa.06@hotmail.com>"]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
bcrypt = "<4.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
sqlmodel = "^0.0.31"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
