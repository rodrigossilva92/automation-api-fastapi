[tool.poetry]
name = "automation-api-fastapi"
version = "0.1.0"
description = "Automation-focused backend API built with FastAPI"
authors = ["Rodrigo Silva <rodrigo.sousa.06@hotmail.com>"]

[tool.poetry.dependencies]
python = "^3.13"
